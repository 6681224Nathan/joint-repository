<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone UX/UI Interactive Presentation</title>
    <!-- Tailwind CSS for modern presentation styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hide scrollbars throughout simulator */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Realistic iPhone chassis shadow and metallic depth */
        .iphone-frame {
            box-shadow:
                0px 0px 0px 4px #2e3033,
                /* Metallic inner bezel */
                0px 0px 0px 12px #1c1d1f,
                /* Matte outer protective border */
                0px 25px 60px rgba(0, 0, 0, 0.6);
            /* Soft, heavy ambient shadow */
        }

        /* Prevent browser nested overflow clipping bugs */
        .iphone-screen {
            isolation: isolate;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        #iphone-viewport {
            border-radius: 44px;
            overflow: hidden;
            isolation: isolate;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        /* Ambient subtle glow on the device screen */
        .iphone-screen::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 50%);
            pointer-events: none;
            z-index: 40;
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        /* Pop in animation for simulated iOS alerts */
        @keyframes scale-up {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-scale-up {
            animation: scale-up 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Slide up animation for bottom sheets */
        @keyframes slide-up {
            0% {
                transform: translateY(100%);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .animate-slide-up {
            animation: slide-up 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Fade animation for scanner and background overlays */
        @keyframes fade-in {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        .animate-fade-in {
            animation: fade-in 0.25s ease-out forwards;
        }

        /* Screen Switch Fade-in-up */
        @keyframes fade-in-up {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-screen-switch {
            animation: fade-in-up 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

<body
    class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-between overflow-x-hidden p-4 lg:p-6 select-none">

    <!-- Top Minimal Info Header for Mahidol University -->
    <header
        class="w-full max-w-4xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 opacity-95 border-b border-slate-900 pb-4 mb-4">
        <div class="flex items-center gap-4">
            <!-- University Logo -->
            <div
                class="w-24 h-12 flex-shrink-0 bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center border border-slate-800 shadow-inner relative">
                <span class="absolute text-[9px] text-indigo-400 font-bold">Mahidol</span>
                <img src="src/img/mahidol_logo.png" alt="Mahidol University Logo"
                    class="absolute inset-0 w-full h-full object-contain p-1.5 z-10"
                    onerror="this.style.display='none'">
            </div>

            <div class="flex flex-col">
                <span class="text-base sm:text-lg font-bold tracking-tight text-white">Mahidol University</span>
                <span class="text-[11px] sm:text-xs font-semibold uppercase tracking-widest text-indigo-400">ICMB222 -
                    Principles Of Marketing</span>
            </div>
        </div>
        <div class="flex flex-col sm:items-end text-xs text-slate-400 font-medium leading-relaxed">
            <div class="font-bold text-slate-200">Group 3</div>
            <div>Section 3</div>
        </div>
    </header>

    <!-- Main Viewport: Centers the gorgeous iPhone 15 Pro Chassis -->
    <main class="flex-1 flex items-center justify-center my-auto">
        <div
            class="relative w-[385px] h-[790px] max-w-full iphone-frame bg-black rounded-[55px] p-[11px] flex items-center justify-center transition-all duration-300">

            <!-- Inner screen viewport container -->
            <div class="w-full h-full rounded-[44px] overflow-hidden bg-black relative flex flex-col iphone-screen">

                <!-- Viewport Content Wrapper (Loads interactive layouts) -->
                <!-- FIXED: Changed overflow-y-auto to overflow-hidden so absolute layers (Alerts, bottom sheets, scanners) layout relative to physical boundaries correctly -->
                <div id="iphone-viewport"
                    class="w-full h-full relative overflow-hidden bg-slate-900 flex flex-col justify-between pb-6 transition-all duration-300">
                    <!-- Screens render inside here dynamically -->
                </div>

                <!-- Physical Dynamic Island punchout (Layered after Viewport to ensure visibility on top) -->
                <div
                    class="absolute top-3 left-1/2 -translate-x-1/2 w-28 h-7 bg-black rounded-3xl z-[55] flex items-center justify-end px-3 shadow-[inset_0_1px_3px_rgba(255,255,255,0.15)] pointer-events-none">
                    <div class="w-2.5 h-2.5 rounded-full bg-slate-950 border border-slate-900 shadow-inner"></div>
                </div>

                <!-- Live-simulated iOS Status Bar indicators (Layered on top of dynamic content) -->
                <div id="status-bar" onclick="scrollToTop()"
                    class="absolute top-0 left-0 right-0 h-11 px-7 flex justify-between items-center text-slate-900 text-[11px] font-bold tracking-tight z-50 cursor-pointer pointer-events-auto">
                    <div>9:41</div>
                    <div class="flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.07 19.64 10.47 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z" />
                        </svg>
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                        </svg>
                        <div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center">
                            <div class="w-full h-full bg-current rounded-2xs"></div>
                        </div>
                    </div>
                </div>

                <!-- Physical Home Indicator line overlay -->
                <div id="home-indicator"
                    class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-black/70 rounded-full z-50 pointer-events-none">
                </div>

            </div>
        </div>
    </main>

    <!-- Bottom Presentation Control Deck -->
    <footer
        class="w-full max-w-sm bg-slate-900/80 border border-slate-800/80 backdrop-blur-md px-4 py-3 rounded-2xl flex flex-col gap-3 mt-6 shadow-xl z-50">
        <!-- Controls: Selector & Step-by-Step navigation -->
        <div class="flex items-center justify-between gap-3">
            <button onclick="prevScreen()"
                class="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 rounded-lg text-slate-300 transition-all font-bold text-sm flex items-center justify-center w-8 h-8">
                ←
            </button>

            <!-- Dropdown Screen jump selector -->
            <select id="screen-dropdown" onchange="goToScreen(this.value)"
                class="flex-1 bg-slate-950 border border-slate-800 text-slate-300 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <!-- Dropdown options injected by JS -->
            </select>

            <button onclick="nextScreen()"
                class="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 rounded-lg text-slate-300 transition-all font-bold text-sm flex items-center justify-center w-8 h-8">
                →
            </button>
        </div>
    </footer>

    <!-- Interactive JS Core Architecture -->
    <script>
        const state = {
            activeScreenId: "screen-1"
        };

        // Simulated Inputs State
        let focusedInputId = "login-email";
        let loginEmailVal = "";
        let loginPasswordVal = "";
        let signupUserVal = "";
        let signupEmailVal = "";
        let signupPasswordVal = "";
        let newsletterChecked = false;

        // Active Game Details for Screen 4
        let activeGameDetails = {
            sport: "Swimming Pool",
            day: "WEDNESDAY",
            rating: "4.8",
            distance: "1.2 miles",
            time: "16:00 - 18:00",
            registered: 3,
            image: "src/img/activity_swimming.png",
            joined: false,
            isUniversityEvent: false
        };

        // Official University Event configuration (Mahidol University Job Fair)
        let universityEvent = {
            sport: "MUIC Job Fair",
            day: "FRIDAY",
            rating: "5.0",
            distance: "MUIC Bldg 1",
            time: "09:00 - 16:00",
            registered: 320,
            image: "src/img/event_jobfair.png",
            desc: "Meet top hiring partners, explore exclusive internships, and attend career workshops at the annual MUIC Job Fair. Bring your resume!",
            isUniversityEvent: true,
            joined: false
        };

        // Point System state configuration
        let userPoints = 350;
        let activeRewardsTab = "redeem";

        let rewardsList = [
            { id: "reward-1", name: "15 THB Canteen Discount", points: 50, category: "MUIC Canteen", emoji: "🍜", image: "src/img/reward_canteen.png" },
            { id: "reward-2", name: "Free Waffle at D'Oro", subtitle: "Aditayathorn Bldg, 1st Fl", points: 80, category: "Café", emoji: "🧇", image: "src/img/reward_doro.png" },
            { id: "reward-3", name: "Free Any Dish at Tharot", subtitle: "Tharot Restaurant (ร้านท่ารถ)", points: 100, category: "Restaurant", emoji: "🍛", image: "src/img/reward_tharot.png" },
            { id: "reward-4", name: "50% Off Starbucks MU", subtitle: "Starbucks Mahidol Branch", points: 150, category: "Café", emoji: "☕", image: "src/img/reward_starbucks.png" }
        ];

        let pointsHistory = [
            { title: "Checked in: MUIC Job Fair", points: "+100", date: "Today, 10:15", icon: "🏢" },
            { title: "Checked in: Table Tennis", points: "+50", date: "Yesterday, 17:05", icon: "🏓" },
            { title: "Joined: Volleyball Game", points: "+50", date: "3 Jul, 15:30", icon: "🏐" },
            { title: "Hosted: Swimming Session", points: "+150", date: "29 Jun, 16:00", icon: "🏊" }
        ];

        function switchRewardsTab(tab) {
            activeRewardsTab = tab;
            renderActiveScreen();
        }

        function renderRewardsTabContentHTML() {
            if (activeRewardsTab === 'redeem') {
                return `
                    <div class="space-y-3">
                        ${rewardsList.map(item => {
                            const isAffordable = userPoints >= item.points;
                            const btnClass = isAffordable 
                                ? "bg-[#2A3373] hover:bg-[#1f2656] text-white" 
                                : "bg-slate-100 text-slate-400 cursor-not-allowed";
                            const onClickHandler = isAffordable 
                                ? `onclick="redeemReward('${item.id}')"` 
                                : '';
                            const subText = item.subtitle ? `<span class="text-[9px] text-slate-400 block">${item.subtitle}</span>` : '';
                            return `
                                <div class="flex items-center justify-between border border-slate-100 rounded-2xl p-3 shadow-xs">
                                    <div class="flex items-center gap-3">
                                        <div class="w-12 h-12 bg-slate-50 border border-slate-100 rounded-xl flex-shrink-0 flex items-center justify-center text-2xl shadow-inner relative overflow-hidden">
                                            <img src="${item.image}" alt="${item.name}" class="absolute inset-0 w-full h-full object-cover z-10" onerror="this.style.display='none'">
                                            <span class="z-0">${item.emoji}</span>
                                        </div>
                                        <div>
                                            <h4 class="text-xs font-bold text-slate-800 leading-tight">${item.name}</h4>
                                            <span class="text-[10px] text-slate-400 font-semibold">${item.category}</span>
                                            ${subText}
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="text-xs font-extrabold text-amber-600">${item.points} pts</span>
                                        <button ${onClickHandler} class="${btnClass} text-[10px] font-bold px-3 py-1.5 rounded-lg transition-colors focus:outline-none">
                                            Redeem
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            } else {
                return `
                    <div class="divide-y divide-slate-100">
                        ${pointsHistory.map(log => {
                            const isNegative = log.points.startsWith('-');
                            const pointsColorClass = isNegative ? 'text-red-500' : 'text-emerald-600';
                            return `
                                <div class="py-3 flex items-center justify-between gap-3">
                                    <div class="flex items-center gap-2.5">
                                        <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-sm shadow-inner">${log.icon}</div>
                                        <div>
                                            <h4 class="text-xs font-bold text-slate-800 leading-tight">${log.title}</h4>
                                            <span class="text-[9px] text-slate-400 font-medium">${log.date}</span>
                                        </div>
                                    </div>
                                    <span class="text-xs font-extrabold ${pointsColorClass}">${log.points} pts</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }
        }

        function generateRandomAlphanumeric(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function showRedemptionSuccessModal(rewardName, couponCode) {
            closeSimulatedAlert();
            
            const alertBox = document.createElement('div');
            alertBox.id = 'simulated-alert';
            alertBox.className = 'absolute inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6 z-[70] animate-fade-in';
            alertBox.innerHTML = `
                <div class="bg-white rounded-3xl w-[270px] text-center overflow-hidden flex flex-col shadow-2xl border border-slate-200/50 animate-scale-up p-5">
                    <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-3">
                        <span class="text-xl">🎉</span>
                    </div>
                    <h4 class="font-bold text-slate-900 text-base">Redeemed Successfully!</h4>
                    <p class="text-[10px] text-slate-500 mt-1.5 leading-relaxed">Present this code at the outlet counter to claim your <strong>${rewardName}</strong>.</p>
                    
                    <!-- Highlighted Coupon Code -->
                    <div class="my-4 bg-[#2A3373]/10 border border-[#2A3373]/20 rounded-2xl py-3 px-4 flex flex-col items-center justify-center">
                        <span class="text-[9px] font-bold text-[#2A3373] tracking-widest uppercase">Redeem Code</span>
                        <span class="text-2xl font-black text-[#2A3373] tracking-wider mt-1 select-all font-mono">${couponCode}</span>
                    </div>
                    
                    <button onclick="goToScreen('screen-10')" class="w-full py-2.5 bg-[#2A3373] hover:bg-[#1f2656] text-white font-bold text-xs rounded-xl shadow-xs transition-colors focus:outline-none">
                        Done
                    </button>
                </div>
            `;
            const viewport = document.getElementById('iphone-viewport');
            if (viewport) {
                viewport.appendChild(alertBox);
            }
        }

        function redeemReward(itemId) {
            const reward = rewardsList.find(r => r.id === itemId);
            if (!reward) return;
            if (userPoints < reward.points) {
                showSimulatedAlert('Insufficient Points', 'You do not have enough points to redeem this item.');
                return;
            }
            
            showSimulatedAlert('Confirm Redemption', `Redeem ${reward.name} for ${reward.points} points?`, () => {
                userPoints -= reward.points;
                pointsHistory.unshift({
                    title: `Redeemed: ${reward.name}`,
                    points: `-${reward.points}`,
                    date: "Just now",
                    icon: "🎁"
                });
                
                const couponCode = generateRandomAlphanumeric(9);
                showRedemptionSuccessModal(reward.name, couponCode);
            });
        }

        function focusInput(inputId) {
            focusedInputId = inputId;
            renderActiveScreen();
        }

        function typeSimulatedKey(char) {
            if (focusedInputId === 'login-email') {
                loginEmailVal += char.toLowerCase();
            } else if (focusedInputId === 'login-password') {
                loginPasswordVal += char.toLowerCase();
            } else if (focusedInputId === 'signup-user') {
                signupUserVal += char;
            } else if (focusedInputId === 'signup-email') {
                signupEmailVal += char.toLowerCase();
            } else if (focusedInputId === 'signup-password') {
                signupPasswordVal += char;
            }
            renderActiveScreen();
        }

        function deleteSimulatedKey() {
            if (focusedInputId === 'login-email') {
                loginEmailVal = loginEmailVal.slice(0, -1);
            } else if (focusedInputId === 'login-password') {
                loginPasswordVal = loginPasswordVal.slice(0, -1);
            } else if (focusedInputId === 'signup-user') {
                signupUserVal = signupUserVal.slice(0, -1);
            } else if (focusedInputId === 'signup-email') {
                signupEmailVal = signupEmailVal.slice(0, -1);
            } else if (focusedInputId === 'signup-password') {
                signupPasswordVal = signupPasswordVal.slice(0, -1);
            }
            renderActiveScreen();
        }

        function createGameSubmit() {
            showSimulatedAlert('Game Created', 'Your new game has been posted for others to join.', () => {
                selectedSport = null;
                selectedSkill = "Just for fun";
                gameDate = null;
                goToScreen('screen-3');
            });
        }

        function joinGameSelect(sportName, day, time, image, rating, distance, registered, isUniversityEvent) {
            activeGameDetails = {
                sport: sportName,
                day: day,
                time: time,
                image: image,
                rating: rating || "4.8",
                distance: distance || "1.2 miles",
                registered: registered || 3,
                joined: false,
                isUniversityEvent: !!isUniversityEvent
            };
            goToScreen('screen-4');
        }

        function toggleJoinGame() {
            activeGameDetails.joined = !activeGameDetails.joined;
            if (activeGameDetails.joined) {
                showSimulatedAlert('Game Joined', `You are registered for ${activeGameDetails.sport}! Please arrive 10 minutes early.`);
            } else {
                showSimulatedAlert('Left Game', `You have unregistered from ${activeGameDetails.sport}.`);
            }
            renderActiveScreen();
        }

        function showEventAnnouncementPopup() {
            closeSimulatedAlert(); // close any existing popup first

            const alertBox = document.createElement('div');
            alertBox.id = 'simulated-alert';
            alertBox.className = 'absolute inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-5 z-[70] animate-fade-in';
            alertBox.innerHTML = `
                <div class="bg-white rounded-3xl w-[290px] text-center overflow-hidden flex flex-col shadow-2xl border border-slate-200/50 animate-scale-up relative">
                    <!-- Top Right Close X Button -->
                    <button onclick="event.stopPropagation(); closeSimulatedAlert();" class="absolute top-3 right-3 w-7 h-7 bg-black/40 hover:bg-black/60 rounded-full flex items-center justify-center text-white text-sm font-semibold transition-colors z-30 focus:outline-none">
                        ✕
                    </button>
                    
                    <!-- Clickable area to join game screen -->
                    <div onclick="joinUniversityEventFromPopup()" class="cursor-pointer text-left flex-1 flex flex-col">
                        <!-- Event Banner Image -->
                        <div class="w-full h-32 relative bg-emerald-800 flex items-center justify-center overflow-hidden">
                            <img src="${universityEvent.image}" alt="Event Banner" class="absolute inset-0 w-full h-full object-cover opacity-90" onerror="this.style.display='none'">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                            
                            <!-- University Logo Badge -->
                            <div class="absolute top-3 left-3 bg-white/95 backdrop-blur-md flex items-center gap-1.5 px-2.5 py-1 rounded-full shadow-md z-10">
                                <img src="src/img/mahidol_logo.png" alt="MU Logo" class="w-4 h-4 object-contain" onerror="this.style.display='none'">
                                <span class="text-emerald-800 font-extrabold text-[8px] tracking-wider uppercase">UNIVERSITY EVENT</span>
                            </div>
                            
                            <div class="absolute bottom-3 left-3 right-3 text-left">
                                <h4 class="font-extrabold text-white text-base tracking-tight leading-tight">${universityEvent.sport}</h4>
                                <p class="text-[10px] text-emerald-300 font-semibold mt-0.5">${universityEvent.day} • ${universityEvent.time}</p>
                            </div>
                        </div>
                        
                        <!-- Body Content -->
                        <div class="p-4 space-y-2">
                            <p class="text-[11px] text-slate-500 leading-relaxed">
                                Meet top hiring partners, explore exclusive internships, and attend career workshops at the annual MUIC Job Fair. Tap here to view details and register!
                            </p>
                        </div>
                    </div>
                    
                    <!-- Dismiss Button at the bottom -->
                    <div class="border-t border-slate-100 w-full">
                        <button onclick="event.stopPropagation(); closeSimulatedAlert();" class="py-3.5 text-xs font-semibold text-slate-400 active:bg-slate-50 hover:bg-slate-50/50 transition-colors w-full focus:outline-none">
                            Dismiss
                        </button>
                    </div>
                </div>
            `;
            const viewport = document.getElementById('iphone-viewport');
            if (viewport) {
                viewport.appendChild(alertBox);
            }
        }

        function joinUniversityEventFromPopup() {
            closeSimulatedAlert();
            joinGameSelect(
                universityEvent.sport,
                universityEvent.day,
                universityEvent.time,
                universityEvent.image,
                universityEvent.rating,
                universityEvent.distance,
                universityEvent.registered,
                true
            );
        }

        function toggleJoinGame() {
            activeGameDetails.joined = !activeGameDetails.joined;
            if (activeGameDetails.joined) {
                showSimulatedAlert('Game Joined', `You are registered for ${activeGameDetails.sport}! Please arrive 10 minutes early.`);
            } else {
                showSimulatedAlert('Left Game', `You have unregistered from ${activeGameDetails.sport}.`);
            }
            renderActiveScreen();
        }

        function getBottomNavHTML(activeTab) {
            const tabs = [
                { id: 1, screen: 'screen-3', label: 'Home' },
                { id: 2, screen: 'screen-6', label: 'Create' },
                { id: 3, screen: 'screen-8', label: 'Scan' },
                { id: 4, screen: 'screen-5', label: 'Activity' },
                { id: 5, screen: 'screen-9', label: 'Profile' }
            ];

            const icons = {
                1: {
                    outline: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10m-9 11h.01" /></svg>`,
                    solid: `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" /></svg>`

                }
            },
            {
                id: "screen-9",
                name: "9. Profile",
                bgGradient: "from-white to-white",
                darkStatusBar: false,
                htmlContent() {
                    return `
                    <div class="flex-1 flex flex-col justify-between bg-white text-slate-900 font-sans h-full pb-2">
                        <div id="scroll-content" class="flex-1 overflow-y-auto no-scrollbar overscroll-contain scroll-smooth flex flex-col">

                            <!-- Green header block -->
                            <div class="relative">
                                <div class="bg-[#2A3373] pt-14 pb-16 px-4 rounded-b-[32px]">
                                    <div class="flex items-center justify-between">
                                        <button onclick="goToScreen('screen-3')" class="text-white text-sm font-semibold hover:opacity-90 transition-opacity z-10">Back</button>
                                        <h2 class="text-2xl font-bold text-white">Profile</h2>
                                        <button onclick="goToScreen('screen-1')" class="text-white text-sm font-semibold hover:opacity-90 transition-opacity z-10">Logout</button>
                                    </div>
                                </div>

                                <!-- Points Badge (Repositioned to the left of the profile photo) -->
                                <div onclick="goToScreen('screen-10')" class="absolute left-6 -bottom-9 flex items-center gap-1.5 cursor-pointer transition-all active:scale-95 z-20">
                                    <img src="src/img/mu_coin.png" alt="Coin" class="w-6 h-6 object-contain" onerror="this.style.display='none'">
                                    <span class="text-xs font-bold text-amber-500">${userPoints} pts</span>
                                </div>

                                <!-- Profile photo overlapping the header -->
                                <div class="absolute left-1/2 -translate-x-1/2 -bottom-11">
                                    <div class="w-24 h-24 rounded-full bg-white p-1 shadow-lg relative flex items-center justify-center">
                                        <div class="w-full h-full rounded-full overflow-hidden flex items-center justify-center bg-gradient-to-tr from-emerald-500 to-teal-500 text-white font-bold text-2xl shadow-inner relative">
                                            <span class="absolute">K</span>
                                            <img src="src/img/profile_pic.png" alt="Profile Photo" class="absolute inset-0 w-full h-full object-cover z-10" onerror="this.style.display='none'">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Name & mantra -->
                            <div class="text-center mt-14 px-4">
                                <h3 class="text-xl font-bold text-slate-900">Kou Napat</h3>
                                <p class="text-xs font-semibold text-slate-400 mt-1">Ready to play anytime!</p>
                            </div>

                            <!-- Achievement / About me tabs -->
                            <div class="px-4 mt-5 flex border-b border-slate-100">
                                <button id="profile-tab-achievement" onclick="switchProfileTab('achievement')" class="flex-1 pb-2.5 text-[13px] font-bold text-[#2A3373] tracking-wide border-b-2 border-[#2A3373]">Achievement</button>
                                <button id="profile-tab-aboutme" onclick="switchProfileTab('aboutme')" class="flex-1 pb-2.5 text-[13px] font-semibold text-slate-400 tracking-wide">About me</button>
                            </div>

                            <!-- Tab content -->
                            <div id="profile-tab-content" class="px-4">
                                ${renderProfileTabContentHTML()}
                            </div>
                        </div>

                        <!-- Bottom Navigation Bar -->
                        ${getBottomNavHTML(5)}
                    </div>
                    `;
                }
            },
            {
                id: "screen-10",
                name: "10. Points & Rewards",
                bgGradient: "from-white to-white",
                darkStatusBar: true,
                htmlContent() {
                    return `
                    <div class="flex-1 flex flex-col justify-between bg-white text-slate-900 font-sans h-full pt-11 pb-2">
                        <div id="scroll-content" class="flex-1 overflow-y-auto no-scrollbar overscroll-contain scroll-smooth flex flex-col">
                            
                            <!-- Header with Back Button -->
                            <div class="px-4 py-2 flex items-center justify-between relative">
                                <button onclick="goToScreen('screen-9')" class="text-[#2A3373] text-sm font-semibold hover:opacity-80 transition-opacity z-10">Back</button>
                                <h2 class="text-base font-bold text-slate-900 absolute left-1/2 -translate-x-1/2">Points &amp; Rewards</h2>
                                <div class="w-8"></div>
                            </div>

                            <!-- Points Dashboard Card -->
                            <div class="mx-4 mt-3 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-3xl p-5 text-white shadow-md relative overflow-hidden">
                                <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
                                <span class="text-xs font-bold text-emerald-100 tracking-wider uppercase">Your Balance</span>
                                <h3 class="text-3xl font-extrabold mt-1 tracking-tight">${userPoints} <span class="text-sm font-semibold text-emerald-100">Points</span></h3>
                                <p class="text-[10px] text-emerald-100/90 mt-2 leading-relaxed">Earn points by playing sports and checking in to activities. Redeem them for discounts at campus restaurants.</p>
                            </div>

                            <!-- Tabs selection -->
                            <div class="px-4 mt-5 flex border-b border-slate-100">
                                <button onclick="switchRewardsTab('redeem')" class="flex-1 pb-2.5 text-[13px] ${activeRewardsTab === 'redeem' ? 'font-bold text-[#2A3373] border-b-2 border-[#2A3373]' : 'font-semibold text-slate-400'}">Redeem Rewards</button>
                                <button onclick="switchRewardsTab('history')" class="flex-1 pb-2.5 text-[13px] ${activeRewardsTab === 'history' ? 'font-bold text-[#2A3373] border-b-2 border-[#2A3373]' : 'font-semibold text-slate-400'}">Points History</button>
                            </div>

                            <!-- Tab Content -->
                            <div class="px-4 py-3">
                                ${renderRewardsTabContentHTML()}
                            </div>
                        </div>

                        <!-- Bottom Navigation Bar -->
                        ${getBottomNavHTML(5)}
                    </div>
                    `;
                }
            }
        ];

        // System Startup
        window.onload = function () {
            populateSelector();
            renderActiveScreen();
        }

        // Populate dropdown options
        function populateSelector() {
            const dropdown = document.getElementById('screen-dropdown');
            if (!dropdown) return; // Safeguard if the element doesn't exist

            dropdown.innerHTML = '';
            screens.forEach(screen => {
                const opt = document.createElement('option');
                opt.value = screen.id;
                opt.textContent = screen.name;
                dropdown.appendChild(opt);
            });
        }

        // Primary Screen Rendering engine
        function renderActiveScreen() {
            const activeScreen = screens.find(s => s.id === state.activeScreenId);
            const viewport = document.getElementById('iphone-viewport');
            if (!viewport) return;

            // Apply corresponding backdrop container gradient (Set to overflow-hidden so active overlays like alerts & dynamic bottom sheets position correctly!)
            viewport.className = `w-full h-full relative overflow-hidden bg-gradient-to-b ${activeScreen.bgGradient} flex flex-col justify-between pb-6 transition-all duration-300`;

            // Adjust presenting dropdown select value
            const dropdown = document.getElementById('screen-dropdown');
            if (dropdown) {
                dropdown.value = activeScreen.id;
            }

            // Handle Dynamic Status Bar Colors
            const statusBar = document.getElementById('status-bar');
            if (statusBar) {
                if (activeScreen.darkStatusBar) {
                    statusBar.classList.remove('text-white');
                    statusBar.classList.add('text-slate-900');
                } else {
                    statusBar.classList.remove('text-slate-900');
                    statusBar.classList.add('text-white');
                }
            }

            // Handle Dynamic Home Indicator bar Colors
            const homeIndicator = document.getElementById('home-indicator');
            if (homeIndicator) {
                if (activeScreen.darkStatusBar) {
                    homeIndicator.classList.remove('bg-white/70');
                    homeIndicator.classList.add('bg-black/70');
                } else {
                    homeIndicator.classList.remove('bg-black/70');
                    homeIndicator.classList.add('bg-white/70');
                }
            }

            // Load pure generated fallback HTML directly in standard preview mode
            const content = typeof activeScreen.htmlContent === 'function'
                ? activeScreen.htmlContent()
                : activeScreen.htmlContent;

            viewport.innerHTML = `
                <div class="absolute inset-0 w-full h-full z-10 flex flex-col justify-between animate-screen-switch rounded-[44px] overflow-hidden">
                    ${content}
                </div>
            `;

            // Show the active session bottom sheet on Homepage if a check-in is in progress
            if (activeScreen.id === 'screen-3' && activeSession) {
                renderActiveSessionSheet();
            }
        }

        // Beautiful Simulated iOS Alert component with complete functional callback architecture
        function showSimulatedAlert(title, message, onOk) {
            closeSimulatedAlert(); // close any existing popup first
            window.__simulatedAlertOnOk = onOk || null;

            const alertBox = document.createElement('div');
            alertBox.id = 'simulated-alert';
            alertBox.className = 'absolute inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6 z-[70] animate-fade-in';
            alertBox.innerHTML = `
                <div class="bg-white/95 backdrop-blur-md rounded-2xl w-[270px] text-center overflow-hidden flex flex-col shadow-xl border border-slate-200/50 animate-scale-up">
                    <div class="p-5 space-y-1.5">
                        <h4 class="font-bold text-slate-900 text-base">${title}</h4>
                        <p class="text-xs text-slate-600 leading-normal">${message}</p>
                    </div>
                    <button onclick="handleSimulatedAlertOk()" class="border-t border-slate-200/80 py-3 text-sm font-semibold text-[#2A3373] active:bg-slate-100 hover:bg-slate-50/50 transition-colors w-full focus:outline-none">
                        OK
                    </button>
                </div>
            `;
            const viewport = document.getElementById('iphone-viewport');
            if (viewport) {
                viewport.appendChild(alertBox);
            }
        }

        function handleSimulatedAlertOk() {
            const callback = window.__simulatedAlertOnOk;
            window.__simulatedAlertOnOk = null;
            closeSimulatedAlert();
            if (callback) callback();
        }

        function closeSimulatedAlert() {
            const popup = document.getElementById('simulated-alert');
            if (popup) popup.remove();
        }

        // Screen state machines
        function goToScreen(screenId) {
            closeSimulatedAlert();
            if (typeof navigator !== 'undefined' && navigator.vibrate) {
                navigator.vibrate(10);
            }
            const previousScreenId = state.activeScreenId;
            state.activeScreenId = screenId;
            renderActiveScreen();

            // Trigger automatic event popup when going from login/signup to homepage
            if (screenId === 'screen-3' && (previousScreenId === 'screen-1' || previousScreenId === 'screen-2')) {
                showEventAnnouncementPopup();
            }
        }

        function prevScreen() {
            const currIdx = screens.findIndex(s => s.id === state.activeScreenId);
            if (currIdx > 0) {
                goToScreen(screens[currIdx - 1].id);
            } else {
                goToScreen(screens[screens.length - 1].id); // Loop back to end
            }
        }

        // Loop screen cycle
        function nextScreen() {
            const currIdx = screens.findIndex(s => s.id === state.activeScreenId);
            if (currIdx < screens.length - 1) {
                goToScreen(screens[currIdx + 1].id);
            } else {
                goToScreen(screens[0].id); // Loop back to start
            }
        }
    </script>
</body>

</html>
